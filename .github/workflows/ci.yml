name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile helpers
        run: python -m compileall -q scripts
      - name: Validate domain catalog
        run: python scripts/validate_catalog.py
      - name: Test complete toolchain
        run: python scripts/test_tools.py
      - name: Test CLI reliability
        run: python -B scripts/test_cli_reliability.py -v
